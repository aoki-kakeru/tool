<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トレードオフ・スライダー</title>
<style>
  :root{
    --bg:#f4f5f7;
    --card:#ffffff;
    --text:#1f2430;
    --muted:#6b7280;
    --border:#e5e7eb;
    --track:#e5e7eb;
    --accent:#4f46e5;
    --accent-dark:#4338ca;
    --accent-soft:#eef2ff;
    --danger:#ef4444;
    --danger-soft:#fef2f2;
    --success:#16a34a;
    --shadow:0 6px 20px rgba(20,20,40,0.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#14161d;
      --card:#1d2029;
      --text:#eef0f4;
      --muted:#9aa0ac;
      --border:#2c303b;
      --track:#2c303b;
      --accent:#818cf8;
      --accent-dark:#6366f1;
      --accent-soft:#232544;
      --danger:#f87171;
      --danger-soft:#2a1b1f;
      --success:#4ade80;
      --shadow:0 6px 24px rgba(0,0,0,0.4);
    }
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    padding:32px 24px 64px;
    background:var(--bg);
    color:var(--text);
    font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;
    line-height:1.5;
  }
  button,input{font:inherit;color:inherit;}

  .wrap{max-width:1200px;margin:0 auto;}

  header{
    display:flex;align-items:flex-end;justify-content:space-between;
    gap:16px;flex-wrap:wrap;margin-bottom:24px;
  }
  h1{margin:0;font-size:24px;letter-spacing:.02em;}
  .sub{margin:4px 0 0;color:var(--muted);font-size:13px;}
  .save-state{font-size:12px;color:var(--muted);}
  .save-state.saved{color:var(--success);}

  .layout{
    display:grid;
    grid-template-columns:minmax(0,1fr) 340px;
    gap:24px;
    align-items:start;
  }
  @media (max-width:960px){
    .layout{grid-template-columns:minmax(0,1fr);}
    .side{position:static !important;}
  }

  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:14px;
    box-shadow:var(--shadow);
  }
  .card-head{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 20px;border-bottom:1px solid var(--border);
  }
  .card-head h2{margin:0;font-size:15px;}
  .count{font-size:12px;color:var(--muted);}

  /* ---- スライダー一覧 ---- */
  #sliders{list-style:none;margin:0;padding:0;}
  .slider-block{
    padding:16px 20px;
    border-bottom:1px solid var(--border);
    transition:background .15s;
  }
  .slider-block:last-child{border-bottom:none;}
  .slider-block:hover{background:color-mix(in srgb,var(--accent-soft) 45%,transparent);}
  .slider-block.dup{background:color-mix(in srgb,var(--danger-soft) 70%,transparent);}

  .block-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
  .label-input{
    flex:1;min-width:0;
    font-weight:600;font-size:15px;
    padding:6px 8px;margin-left:-8px;
    border:1px solid transparent;border-radius:8px;
    background:transparent;outline:none;
    transition:border-color .15s,background .15s;
  }
  .label-input:hover{border-color:var(--border);}
  .label-input:focus{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px var(--accent-soft);}
  .label-input::placeholder{color:var(--muted);font-weight:400;}
  .label-input.invalid{border-color:var(--danger);}

  .priority{
    flex:none;min-width:48px;
    text-align:center;font-size:13px;font-weight:700;
    border-radius:999px;padding:3px 10px;color:#fff;
    font-variant-numeric:tabular-nums;
    transition:background-color .2s;
  }
  .icon-btn{
    flex:none;width:32px;height:32px;
    display:grid;place-items:center;
    border:1px solid transparent;border-radius:8px;
    background:transparent;color:var(--muted);cursor:pointer;
    opacity:.55;transition:opacity .15s,background .15s,color .15s;
  }
  .slider-block:hover .icon-btn,.icon-btn:focus-visible{opacity:1;}
  .icon-btn:hover{background:var(--danger-soft);color:var(--danger);}
  .icon-btn:disabled{visibility:hidden;}

  .slider-row{display:flex;align-items:center;gap:12px;}
  .edge{
    flex:none;width:36px;text-align:center;
    font-size:11px;font-weight:700;letter-spacing:.04em;color:var(--muted);
  }
  .range-wrap{flex:1;min-width:0;}
  input[type="range"]{
    --pct:0%;--c:var(--accent);
    width:100%;margin:0;height:22px;
    appearance:none;-webkit-appearance:none;background:transparent;cursor:pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track{
    height:6px;border-radius:3px;
    background:linear-gradient(to right,var(--c) var(--pct),var(--track) var(--pct));
  }
  input[type="range"]::-moz-range-track{height:6px;border-radius:3px;background:var(--track);}
  input[type="range"]::-moz-range-progress{height:6px;border-radius:3px;background:var(--c);}
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;
    width:20px;height:20px;margin-top:-7px;border-radius:50%;
    background:var(--card);border:3px solid var(--c);
    box-shadow:0 1px 4px rgba(0,0,0,.25);
    transition:transform .1s;
  }
  input[type="range"]::-moz-range-thumb{
    width:14px;height:14px;border-radius:50%;
    background:var(--card);border:3px solid var(--c);
    box-shadow:0 1px 4px rgba(0,0,0,.25);
  }
  input[type="range"]:active::-webkit-slider-thumb{transform:scale(1.15);}
  input[type="range"]:focus-visible{outline:none;}
  input[type="range"]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--accent-soft),0 1px 4px rgba(0,0,0,.25);}

  .ticks{
    display:flex;justify-content:space-between;
    padding:0 10px;margin-top:2px;
    font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums;
  }
  .ticks span{width:0;display:flex;justify-content:center;white-space:nowrap;}
  .ticks span.on{color:var(--text);font-weight:700;}

  .warning{font-size:12px;color:var(--danger);margin-top:6px;display:none;}
  .warning.show{display:block;}

  .card-foot{padding:14px 20px;border-top:1px solid var(--border);}

  /* ---- ボタン ---- */
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:6px;
    padding:8px 14px;border-radius:9px;
    border:1px solid var(--border);background:var(--card);
    font-size:13px;font-weight:600;cursor:pointer;
    transition:background .15s,border-color .15s,transform .05s;
  }
  .btn:hover{background:var(--accent-soft);border-color:var(--accent);}
  .btn:active{transform:translateY(1px);}
  .btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);}
  .btn.ghost{border-style:dashed;width:100%;color:var(--muted);}
  .btn.ghost:hover{color:var(--accent);}
  .btn.danger:hover{background:var(--danger-soft);border-color:var(--danger);color:var(--danger);}
  kbd{
    font-family:ui-monospace,monospace;font-size:10px;
    padding:1px 5px;border:1px solid var(--border);border-radius:4px;color:var(--muted);
  }

  /* ---- サイドパネル ---- */
  .side{position:sticky;top:24px;display:flex;flex-direction:column;gap:16px;}
  .side .body{padding:16px 20px;}

  .status{
    display:flex;gap:10px;align-items:flex-start;
    padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:14px;
  }
  .status.ok{background:color-mix(in srgb,var(--success) 12%,transparent);color:var(--success);}
  .status.ng{background:var(--danger-soft);color:var(--danger);}
  .status b{font-weight:700;}

  .rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;}
  .rank li{display:grid;grid-template-columns:44px minmax(0,1fr);align-items:center;gap:10px;font-size:13px;}
  .rank .p{
    text-align:center;font-size:11px;font-weight:700;color:#fff;
    border-radius:999px;padding:2px 0;font-variant-numeric:tabular-nums;
  }
  .rank .bar-wrap{position:relative;height:26px;border-radius:6px;background:var(--track);overflow:hidden;}
  .rank .bar{position:absolute;inset:0 auto 0 0;border-radius:6px;opacity:.22;transition:width .25s;}
  .rank .name{
    position:relative;z-index:1;display:block;
    padding:0 10px;line-height:26px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .rank .name.empty{color:var(--muted);font-style:italic;}

  .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .actions .full{grid-column:1/-1;}
  .hint{font-size:12px;color:var(--muted);margin:12px 0 0;}

  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    background:var(--text);color:var(--bg);
    padding:10px 18px;border-radius:10px;font-size:13px;font-weight:600;
    box-shadow:var(--shadow);opacity:0;pointer-events:none;
    transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>トレードオフ・スライダー</h1>
      <p class="sub">各項目の優先度を決めます。左（MAX）ほど優先度が高く、P0 が最優先です。同じ優先度は重複させないのが原則です。</p>
    </div>
    <span class="save-state" id="saveState">自動保存</span>
  </header>

  <div class="layout">
    <!-- 左：スライダー -->
    <section class="card">
      <div class="card-head">
        <h2>項目</h2>
        <span class="count" id="count"></span>
      </div>
      <ol id="sliders"></ol>
      <div class="card-foot">
        <button class="btn ghost" id="addBtn" type="button">＋ 項目を追加 <kbd>Ctrl</kbd>+<kbd>Enter</kbd></button>
      </div>
    </section>

    <!-- 右：サマリー -->
    <aside class="side">
      <section class="card">
        <div class="card-head"><h2>優先順位</h2></div>
        <div class="body">
          <div class="status" id="status"></div>
          <ol class="rank" id="rank"></ol>
        </div>
      </section>

      <section class="card">
        <div class="card-head"><h2>操作</h2></div>
        <div class="body">
          <div class="actions">
            <button class="btn" id="sortBtn" type="button">優先度順に並替</button>
            <button class="btn" id="autoBtn" type="button">重複を自動解消</button>
            <button class="btn primary full" id="copyMdBtn" type="button">Markdownでコピー</button>
            <button class="btn" id="copyJsonBtn" type="button">JSONコピー</button>
            <button class="btn" id="downloadBtn" type="button">JSON保存</button>
            <button class="btn" id="importBtn" type="button">JSON読込</button>
            <button class="btn danger" id="resetBtn" type="button">初期状態に戻す</button>
          </div>
          <input type="file" id="fileInput" accept="application/json,.json" hidden>
          <p class="hint">内容はこのブラウザに自動保存されます。</p>
        </div>
      </section>
    </aside>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
  const STORAGE_KEY = "tradeoff-slider:v1";

  // 初期項目
  const DEFAULT_ITEMS = [
    { name: "クオリティ(Q)", priority: 0 },
    { name: "期日(D)", priority: 2 },
    { name: "スコープ（機能を全て揃える）(S)", priority: 3 },
    { name: "ベロシティ", priority: 4 },
    { name: "スキルトランスファー", priority: 1 },
  ];

  const colors = [
    "#2c7be5", "#1fa2ff", "#2bb673", "#7cc576", "#b5cc18",
    "#f1c40f", "#f39c12", "#e67e22", "#e74c3c", "#c0392b"
  ];
  const colorOf = p => colors[p] ?? "#6b7280";

  const container = document.getElementById("sliders");
  const rankEl = document.getElementById("rank");
  const statusEl = document.getElementById("status");
  const countEl = document.getElementById("count");
  const saveStateEl = document.getElementById("saveState");
  const toastEl = document.getElementById("toast");

  const blocks = () => [...container.children];
  const maxPriority = () => Math.max(blocks().length - 1, 0);

  function addSlider(title = "", value = null, { focus = false } = {}) {
    const count = container.children.length;

    // 追加時は P を自動で増やす
    if (value === null) value = count;

    const block = document.createElement("li");
    block.className = "slider-block";
    block.innerHTML = `
      <div class="block-top">
        <input class="label-input" placeholder="項目名を入力" aria-label="項目名">
        <span class="priority"></span>
        <button class="icon-btn" type="button" title="削除" aria-label="削除">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
        </button>
      </div>
      <div class="slider-row">
        <span class="edge">MAX</span>
        <div class="range-wrap">
          <input type="range" min="0" step="1" aria-label="優先度">
          <div class="ticks"></div>
        </div>
        <span class="edge">MIN</span>
      </div>
      <div class="warning">※ 項目名を入力してください</div>
    `;

    const nameInput = block.querySelector(".label-input");
    const slider = block.querySelector('input[type="range"]');
    const warning = block.querySelector(".warning");

    nameInput.value = title;

    nameInput.addEventListener("input", () => {
      if (nameInput.value.trim()) setWarning(false);
      refresh();
    });
    nameInput.addEventListener("blur", () => setWarning(!nameInput.value.trim()));
    nameInput.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.isComposing && !(e.ctrlKey || e.metaKey)) {
        e.preventDefault();
        slider.focus();
      }
    });

    function setWarning(on) {
      warning.classList.toggle("show", on);
      nameInput.classList.toggle("invalid", on);
    }

    slider.addEventListener("input", refresh);
    block.querySelector(".icon-btn").addEventListener("click", () => removeSlider(block));

    container.appendChild(block);

    // 既存スライダーの max も更新
    syncMax();
    slider.value = value;
    refresh();

    if (focus) {
      nameInput.focus();
      block.scrollIntoView({ block: "nearest", behavior: "smooth" });
    }
    return block;
  }

  function removeSlider(block) {
    if (blocks().length <= 1) return;
    const name = block.querySelector(".label-input").value.trim() || "（無題）";
    block.remove();
    syncMax();
    refresh();
    toast(`「${name}」を削除しました`);
  }

  function syncMax() {
    const max = maxPriority();
    blocks().forEach(b => {
      const r = b.querySelector('input[type="range"]');
      const v = Math.min(Number(r.value), max);
      r.max = max;
      r.value = v;
      const ticks = b.querySelector(".ticks");
      ticks.innerHTML = Array.from({ length: max + 1 }, (_, i) => `<span>P${i}</span>`).join("");
    });
  }

  function readItems() {
    return blocks().map(b => ({
      name: b.querySelector(".label-input").value,
      priority: Number(b.querySelector('input[type="range"]').value),
    }));
  }

  // 画面全体の再描画（バッジ・トラック色・重複・サマリー）
  function refresh() {
    const items = readItems();
    const max = maxPriority();
    const usage = new Map();
    items.forEach(it => usage.set(it.priority, (usage.get(it.priority) || 0) + 1));

    blocks().forEach((b, i) => {
      const p = items[i].priority;
      const slider = b.querySelector('input[type="range"]');
      const badge = b.querySelector(".priority");
      badge.textContent = `P${p}`;
      badge.style.backgroundColor = colorOf(p);
      slider.style.setProperty("--c", colorOf(p));
      slider.style.setProperty("--pct", max ? `${(p / max) * 100}%` : "0%");
      b.querySelectorAll(".ticks span").forEach((t, ti) => t.classList.toggle("on", ti === p));
      b.classList.toggle("dup", usage.get(p) > 1);
      b.querySelector(".icon-btn").disabled = items.length <= 1;
    });

    countEl.textContent = `${items.length} 項目`;

    // ステータス
    const dups = [...usage.entries()].filter(([, n]) => n > 1).map(([p]) => p).sort((a, b) => a - b);
    const unused = Array.from({ length: max + 1 }, (_, i) => i).filter(i => !usage.has(i));
    if (dups.length === 0) {
      statusEl.className = "status ok";
      statusEl.innerHTML = "✓ <span>優先度はすべて一意です</span>";
    } else {
      statusEl.className = "status ng";
      statusEl.innerHTML = `! <span><b>${dups.map(p => "P" + p).join(", ")}</b> が重複しています` +
        (unused.length ? `（未使用: ${unused.map(p => "P" + p).join(", ")}）` : "") + "</span>";
    }

    // サマリー（優先度順・同順位は入力順）
    const sorted = items.map((it, i) => ({ ...it, i })).sort((a, b) => a.priority - b.priority || a.i - b.i);
    rankEl.innerHTML = "";
    sorted.forEach(it => {
      const li = document.createElement("li");
      const width = max ? 100 - (it.priority / max) * 70 : 100;
      li.innerHTML = `
        <span class="p" style="background:${colorOf(it.priority)}">P${it.priority}</span>
        <span class="bar-wrap">
          <span class="bar" style="width:${width}%;background:${colorOf(it.priority)}"></span>
          <span class="name"></span>
        </span>`;
      const nameEl = li.querySelector(".name");
      const name = it.name.trim();
      nameEl.textContent = name || "（未入力）";
      nameEl.classList.toggle("empty", !name);
      nameEl.title = name;
      rankEl.appendChild(li);
    });

    save(items);
  }

  // ---- 保存 ----
  let saveTimer;
  function save(items) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
      saveStateEl.textContent = "✓ 保存済み";
      saveStateEl.classList.add("saved");
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        saveStateEl.textContent = "自動保存";
        saveStateEl.classList.remove("saved");
      }, 1200);
    } catch (_) { /* 保存できない環境では何もしない */ }
  }

  function load() {
    try {
      const data = JSON.parse(localStorage.getItem(STORAGE_KEY));
      return isValidItems(data) ? data : null;
    } catch (_) {
      return null;
    }
  }

  function isValidItems(data) {
    return Array.isArray(data) && data.length > 0 &&
      data.every(d => d && typeof d.name === "string" && Number.isInteger(d.priority));
  }

  function render(items) {
    container.innerHTML = "";
    // max 確定前に value を入れると丸められるため、先に全件追加してから値を設定する
    items.forEach(it => addSlider(it.name, 0));
    blocks().forEach((b, i) => {
      b.querySelector('input[type="range"]').value = Math.min(Math.max(items[i].priority, 0), maxPriority());
    });
    refresh();
  }

  // ---- 操作 ----
  function sortByPriority() {
    const items = readItems().map((it, i) => ({ ...it, i })).sort((a, b) => a.priority - b.priority || a.i - b.i);
    render(items);
    toast("優先度順に並べ替えました");
  }

  // 同順位は入力順で詰めて P0〜Pn-1 を一意に割り当てる
  function resolveDuplicates() {
    const items = readItems();
    items.map((it, i) => ({ p: it.priority, i }))
      .sort((a, b) => a.p - b.p || a.i - b.i)
      .forEach((x, rank) => { items[x.i].priority = rank; });
    render(items);
    toast("重複を解消しました");
  }

  function toMarkdown() {
    const sorted = readItems().sort((a, b) => a.priority - b.priority);
    return ["| 優先度 | 項目 |", "| --- | --- |",
      ...sorted.map(it => `| P${it.priority} | ${(it.name.trim() || "（未入力）").replace(/\|/g, "\\|")} |`)].join("\n");
  }

  async function copy(text, label) {
    try {
      await navigator.clipboard.writeText(text);
      toast(`${label}をコピーしました`);
    } catch (_) {
      const ta = Object.assign(document.createElement("textarea"), { value: text });
      document.body.appendChild(ta);
      ta.select();
      document.execCommand("copy");
      ta.remove();
      toast(`${label}をコピーしました`);
    }
  }

  function downloadJSON() {
    const blob = new Blob([JSON.stringify(readItems(), null, 2)], { type: "application/json" });
    const a = Object.assign(document.createElement("a"), {
      href: URL.createObjectURL(blob),
      download: `tradeoff_slider_${new Date().toISOString().slice(0, 10)}.json`,
    });
    a.click();
    URL.revokeObjectURL(a.href);
  }

  function importJSON(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!isValidItems(data)) throw new Error();
        render(data);
        toast("JSONを読み込みました");
      } catch (_) {
        toast("読み込めない形式のファイルです");
      }
    };
    reader.readAsText(file);
  }

  let toastTimer;
  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toastEl.classList.remove("show"), 1800);
  }

  const $ = id => document.getElementById(id);
  $("addBtn").addEventListener("click", () => addSlider("", null, { focus: true }));
  $("sortBtn").addEventListener("click", sortByPriority);
  $("autoBtn").addEventListener("click", resolveDuplicates);
  $("copyMdBtn").addEventListener("click", () => copy(toMarkdown(), "Markdown"));
  $("copyJsonBtn").addEventListener("click", () => copy(JSON.stringify(readItems(), null, 2), "JSON"));
  $("downloadBtn").addEventListener("click", downloadJSON);
  $("importBtn").addEventListener("click", () => $("fileInput").click());
  $("fileInput").addEventListener("change", e => {
    if (e.target.files[0]) importJSON(e.target.files[0]);
    e.target.value = "";
  });
  $("resetBtn").addEventListener("click", () => {
    if (!confirm("初期状態に戻しますか？現在の内容は失われます。")) return;
    render(DEFAULT_ITEMS);
    toast("初期状態に戻しました");
  });
  document.addEventListener("keydown", e => {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      addSlider("", null, { focus: true });
    }
  });

  render(load() ?? DEFAULT_ITEMS);
</script>
</body>
</html>
